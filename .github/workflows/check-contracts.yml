# Guards on the contracts themselves, as opposed to check-derived.yml, which
# guards files regenerated from them.
#
# Each API ships a real draft 2020-12 JSON Schema, and component-api/README.md
# describes its one as "validated against all real entries" — but no script
# and no job ever ran that validation, so the claim rested on someone having
# checked by hand once. A schema nothing invokes is documentation, not a guard.
#
# index.html's DATA array is a second full inventory of the same 71
# components, duplicating id, kind, tagName and file from component-api/.
# AGENTS.md opens by warning that adding a component means editing both and
# that nothing errors if you forget, leaving it documented but invisible in
# the UI. This is that missing error.
name: Check contracts are consistent

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The only third-party dependency in this repo's CI. Everything else
      # here is stdlib Python; validating draft 2020-12 by hand would mean
      # reimplementing JSON Schema, which is plainly worse.
      - name: Install jsonschema
        run: python3 -m pip install jsonschema

      - name: Validate every entry against its own API's schema
        run: python3 validate-schemas.py

  index-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check index.html DATA agrees with component-api/
        run: python3 check-index-data.py
