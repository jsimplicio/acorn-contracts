# Two derived artifacts are checked in, and both have already gone stale
# unnoticed. This job regenerates each and fails if it moved.
#
# token-api/resolved/ is a derived artifact that is nonetheless checked in:
# it is generated from base/, components/ and id-map.json by resolve.py, and
# committed so a consumer can read a final value without reimplementing the
# resolution algorithm. Nothing forced it to stay current, and it did go
# stale: re-running the committed resolve.py against the committed inputs
# once produced a 27-file diff, including a token name from a sync several
# changes earlier.
#
# This is the guard. resolve.py reads only local files, so the check is just
# "regenerate and see if anything moved".
name: Check derived files are current

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolved:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate token-api/resolved/
        run: python3 token-api/resolve.py

      - name: Fail if it differs from what is committed
        run: |
          if ! git diff --quiet -- token-api/resolved/; then
            echo "::error::token-api/resolved/ is out of date. Run 'python3 token-api/resolve.py' and commit the result."
            git diff --stat -- token-api/resolved/
            exit 1
          fi
          echo "token-api/resolved/ matches its sources."

      # figma-token-map.json is derived the same deterministic way and was
      # guarded by nothing. figma-check.py reads resolved/*.json among its
      # inputs, so it runs here, after resolve.py, rather than in a job that
      # would have to regenerate resolved/ again just to have it current.
      # No network: the Figma side is the committed figma-variables-dump.json.
      - name: Regenerate token-api/figma-token-map.json
        run: python3 token-api/figma-check.py

      - name: Fail if it differs from what is committed
        run: |
          if ! git diff --quiet -- token-api/figma-token-map.json; then
            echo "::error::token-api/figma-token-map.json is out of date. Run 'python3 token-api/figma-check.py' and commit the result."
            git diff --stat -- token-api/figma-token-map.json
            exit 1
          fi
          echo "token-api/figma-token-map.json matches its sources."

  meta:
    # component-api/_meta.json and guidance-api/_meta.json record each file's
    # real last commit. They go stale two ways, both of which have happened:
    # a history rewrite leaves every entry citing a SHA that no longer exists,
    # and a newly added file simply never gets an entry (14 were missing).
    # fetch-depth: 0 because the script reads per-file git history, which a
    # shallow clone does not have.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check _meta.json is current
        run: python3 update-meta.py --check
