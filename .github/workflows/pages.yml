# Publishes the wiki (index.html plus the three APIs it reads) to GitHub
# Pages. Two things have to be fixed up at deploy time, because neither is
# true of the repo as checked out:
#
#   * A project site is served from /<repo>/, not from the domain root, so
#     the <base href> in index.html is rewritten to the real base path.
#     configure-pages reports it, which also gets a user site (/) and a
#     custom domain (/) right without special-casing them here.
#   * The site uses real path routing (/button, /tokens/color), and Pages
#     has no equivalent of serve.sh's SPA fallback. Pages does serve
#     404.html for any path with no file behind it, so a copy of index.html
#     under that name is the fallback: a deep link renders the right view,
#     just with a 404 status on the initial response.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one is always the newer commit.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - name: Point the site at its Pages base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          base="${BASE_PATH:-/}"
          case "$base" in
            */) ;;
            *) base="$base/" ;;
          esac
          # Fail loudly rather than deploy a site whose every fetch 404s:
          # if this tag ever stops matching, the rewrite silently no-ops.
          grep -q '<base href="/">' index.html
          sed -i "s|<base href=\"/\">|<base href=\"$base\">|" index.html
          grep -q "<base href=\"$base\">" index.html
          echo "base href set to $base"

      - name: Add the SPA fallback
        run: cp index.html 404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
